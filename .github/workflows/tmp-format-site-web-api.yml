name: Temporary Site Web API Formatter

on:
  push:
    branches:
      - adpp/work/site-web-google-final-fix

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun ci
      - run: bunx prettier --write supabase/functions/site-web-api/index.ts
      - run: |
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/site-web-api/index.ts
          git commit -m "chore: format site web api"
          git push
