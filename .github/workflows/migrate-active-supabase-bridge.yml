name: Migrate active Supabase bridge
on:
  push:
    branches:
      - 'adpp/work/site-web-active-backend-bridge'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply active Supabase migration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          config = Path('supabase/config.toml')
          text = config.read_text()
          text = text.replace('project_id = "mgkeqwwzhcodntkakqaz"', 'project_id = "wdygsbmivqxvgkgpbrqc"')
          if '[functions.site-web-api]' not in text:
              text += '\n[functions.site-web-api]\nverify_jwt = false\n'
          config.write_text(text)

          checker = Path('scripts/check-protected-files.mjs')
          text = checker.read_text().replace('  "supabase/config.toml",\n', '')
          checker.write_text(text)

          api = Path('src/lib/site-web-api.ts')
          text = api.read_text()
          marker = 'const functionName = "site-web-api";'
          if 'const activeSupabaseUrl =' not in text:
              text = text.replace(marker, marker + '\nconst activeSupabaseUrl = "https://wdygsbmivqxvgkgpbrqc.supabase.co";')
          text = text.replace('`${supabaseUrl}/functions/v1/${functionName}`', '`${activeSupabaseUrl}/functions/v1/${functionName}`')
          api.write_text(text)

          fn = Path('supabase/functions/site-web-api/index.ts')
          text = fn.read_text()
          old = '''const getUserId = async (req: Request) => {
            const auth = req.headers.get("authorization");
            if (!auth?.startsWith("Bearer ")) return null;
            const response = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
              headers: {
                Authorization: auth,
                apikey: Deno.env.get("SUPABASE_ANON_KEY") ?? "",
              },
            });
            if (!response.ok) return null;
            const user = await response.json();
            return typeof user?.id === "string" ? user.id : null;
          };'''
          new = '''const LEGACY_SUPABASE_URL = "https://mgkeqwwzhcodntkakqaz.supabase.co";
          const LEGACY_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1na2Vxd3d6aGNvZG50a2FrcWF6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE0Mjg5NTgsImV4cCI6MjA5NzAwNDk1OH0.eQQP9_GDtzXTP1mF0Vx2QQIe0w0TMhzEQKDDjf6KBcQ";

          const getUserId = async (req: Request) => {
            const auth = req.headers.get("authorization");
            if (!auth?.startsWith("Bearer ")) return null;
            for (const baseUrl of [SUPABASE_URL, LEGACY_SUPABASE_URL]) {
              const response = await fetch(`${baseUrl}/auth/v1/user`, {
                headers: {
                  Authorization: auth,
                  apikey:
                    baseUrl === LEGACY_SUPABASE_URL
                      ? LEGACY_SUPABASE_ANON_KEY
                      : Deno.env.get("SUPABASE_ANON_KEY") ?? "",
                },
              });
              if (!response.ok) continue;
              const user = await response.json();
              if (typeof user?.id === "string") return user.id;
            }
            return null;
          };'''
          if old not in text:
              raise SystemExit('Expected getUserId block not found')
          fn.write_text(text.replace(old, new))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/config.toml scripts/check-protected-files.mjs src/lib/site-web-api.ts supabase/functions/site-web-api/index.ts
          git commit -m 'fix(site-web): bridge legacy Supabase auth to active backend'
          git push
      - name: Remove one-shot workflow
        run: |
          rm -f .github/workflows/migrate-active-supabase-bridge.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/migrate-active-supabase-bridge.yml
          git commit -m 'chore: remove one-shot migration workflow'
          git push
