name: Temporary Journal SST layout
on:
  push:
    branches:
      - adpp/work/sst-restore-historical-mission-form
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Journal SST layout
        shell: python
        run: |
          from pathlib import Path
          import re

          route = Path('src/routes/_authenticated/journal-sst.tsx')
          s = route.read_text()
          s = s.replace('import { SstReconciliationPanel } from "@/components/pilot/panels/SstReconciliationPanel";\n', '')
          s = s.replace('          <SstReconciliationPanel />\n', '')
          route.write_text(s)

          path = Path('src/components/pilot/SstProfitability.tsx')
          s = path.read_text()
          s = s.replace('import { sstDuplicateReport, sstDuplicateTotal } from "@/lib/sst-duplicates";\n', '')
          s = re.sub(r'\n  // Rapport de doublons : toutes années confondues, signalement seul\.\n  const duplicateGroups = useMemo\(.*?\n  const duplicateTotal = useMemo\(.*?\n', '\n', s, flags=re.S)

          old_card = '''        <PilotCard\n          storageId="sst-marge"\n          label="Marge brute"\n          value={formatEuro(totals.margin)}\n          sub={`${pct(totals.marginPct)} de marge`}\n          tone={totals.margin >= 0 ? "positive" : "negative"}\n          progress={totals.marginPct != null ? Math.min(100, (totals.marginPct / marginTarget) * 100) : undefined}\n          help={`Marge = CA client − coût sous-traitant. Objectif paramétré : ${marginTarget} %.`}\n          views={[\n            {\n              key: "marge",\n              label: "Marge brute",\n              value: formatEuro(totals.margin),\n              sub: `${pct(totals.marginPct)} de marge`,\n              tone: totals.margin >= 0 ? "positive" : "negative",\n            },\n            {\n              key: "moyenne",\n              label: "Marge moyenne / mission",\n              value: formatEuro(totals.avgMarginPerMission ?? 0),\n              sub: `${totals.missions} mission(s)`,\n            },\n          ]}\n        />'''
          new_card = '''        <PilotCard\n          storageId="sst-marge-moyenne"\n          label="Marge moyenne / mission"\n          value={formatEuro(totals.avgMarginPerMission ?? 0)}\n          sub={`${totals.missions} mission(s)`}\n          tone={(totals.avgMarginPerMission ?? 0) >= 0 ? "positive" : "negative"}\n          help="Marge moyenne dégagée par mission sous-traitée."\n        />'''
          if old_card not in s:
              raise SystemExit('marge card pattern not found')
          s = s.replace(old_card, new_card)

          detail = '''              <div className="overflow-x-auto">\n                <Table>\n                  <TableHeader>\n                    <TableRow>\n                      <TableHead>Période</TableHead>\n                      <TableHead>Libellé d'origine</TableHead>\n                      <TableHead>Prestataire réel</TableHead>\n                      <TableHead>Client</TableHead>\n                      <TableHead className="text-right">Montant</TableHead>\n                      <TableHead />\n                    </TableRow>\n                  </TableHeader>\n                  <TableBody>\n                    {mappedLines.map((l) => (\n                      <TableRow key={l.id} className={l.duplicateOfMission ? "opacity-50" : undefined}>\n                        <TableCell className="whitespace-nowrap">\n                          {String(l.month).padStart(2, "0")}/{l.year}\n                        </TableCell>\n                        <TableCell>{l.designation}</TableCell>\n                        <TableCell>\n                          <Select\n                            value={l.mappedSubcontractorId ?? "none"}\n                            onValueChange={(v) =>\n                              mapMutation.mutate({\n                                raw_label: l.designation,\n                                subcontractor_id: v === "none" ? null : v,\n                              })\n                            }\n                          >\n                            <SelectTrigger className="h-8 w-48">\n                              <SelectValue placeholder="À rattacher" />\n                            </SelectTrigger>\n                            <SelectContent>\n                              <SelectItem value="none">À rattacher</SelectItem>\n                              {ssts.map((s) => (\n                                <SelectItem key={s.id} value={s.id}>\n                                  {s.name}\n                                </SelectItem>\n                              ))}\n                            </SelectContent>\n                          </Select>\n                          {!l.confirmed && (\n                            <span className="block pt-1 text-[11px] text-muted-foreground">\n                              Détection auto : {l.provider}\n                            </span>\n                          )}\n                        </TableCell>\n                        <TableCell>{l.clientName ?? "—"}</TableCell>\n                        <TableCell className="text-right">{formatEuro(l.amount)}</TableCell>\n                        <TableCell className="text-right">\n                          {l.duplicateOfMission && <Badge variant="outline">Déjà en mission</Badge>}\n                        </TableCell>\n                      </TableRow>\n                    ))}\n                  </TableBody>\n                </Table>\n              </div>\n'''
          if detail not in s:
              raise SystemExit('charge detail table pattern not found')
          s = s.replace(detail, '')

          dup_card = re.compile(r'\n      <Card>\n        <CardHeader className="pb-2">\n          <CardTitle className="text-base">Doublons potentiels de sous-traitance \(rapport\)</CardTitle>.*?\n      </Card>\n\n      <Card>\n        <CardHeader className="pb-2">\n          <CardTitle className="text-base">Journal des missions sous-traitées</CardTitle>', re.S)
          s, n = dup_card.subn('''\n      <Card>\n        <CardHeader className="pb-2">\n          <CardTitle className="text-base">Journal des missions sous-traitées</CardTitle>''', s, count=1)
          if n != 1:
              raise SystemExit('duplicate report card pattern not found')

          path.write_text(s)
          print('Journal SST layout changes applied')
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/_authenticated/journal-sst.tsx src/components/pilot/SstProfitability.tsx
          git diff --cached --quiet || git commit -m "fix(sst): reorganize journal page"
          git push
