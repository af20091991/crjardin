name: mobile-client-build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["mobile/**", "public/js-icon-512.png", "public/js-logo.png", ".github/workflows/mobile-client-build.yml"]
jobs:
  android-client:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Appli client : charge uniquement l'espace client Jardin Signature.
      PP_APP_URL: https://crjardin.lovable.app/jardin-signature
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: mobile/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci --no-audit --no-fund
        working-directory: mobile
      - run: npx cap sync android
        working-directory: mobile
      - name: Version depuis public/mobile-version.json
        run: |
          echo "VERSION_CODE=$(jq -r .latestBuild public/mobile-version.json)" >> $GITHUB_ENV
          echo "VERSION_NAME=$(jq -r .versionName public/mobile-version.json)" >> $GITHUB_ENV
      - name: Installer ImageMagick (icônes)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
      - name: Copie du projet Android pour l'appli client
        run: |
          # Copie à côté de android/ : les chemins relatifs vers node_modules restent valides.
          rm -rf mobile/android-client
          cp -r mobile/android mobile/android-client
          rm -rf mobile/android-client/app/build
          # Pas de notifications push pour l'appli client pour l'instant : son identifiant n'est pas encore déclaré dans Firebase.
          rm -f mobile/android-client/app/google-services.json
          cd mobile/android-client/app
          sed -i 's/applicationId "fr.delagraineaujardin.pp"/applicationId "fr.delagraineaujardin.jardinsignature"/' build.gradle
          sed -i 's#<string name="app_name">PilotPro</string>#<string name="app_name">Jardin Signature</string>#' src/main/res/values/strings.xml
          sed -i 's#<string name="title_activity_main">PilotPro</string>#<string name="title_activity_main">Jardin Signature</string>#' src/main/res/values/strings.xml
          # Lien personnel : touché dans un SMS ou un e-mail, il ouvre directement l'appli client.
          sed -i 's#<data android:scheme="https" android:host="crjardin.lovable.app" />#<data android:scheme="https" android:host="crjardin.lovable.app" android:pathPrefix="/jardin-signature" /><data android:scheme="https" android:host="crjardin.lovable.app" android:pathPrefix="/partage/" />#' src/main/AndroidManifest.xml
          # Écran de démarrage natif : logo Jardin Signature sur fond blanc (remplace le visuel PilotPro).
          for f in $(find src/main/res -name splash.png); do
            dims=$(identify -format "%w %h" "$f")
            set -- $dims
            m=$(( $1 < $2 ? $1 : $2 )); l=$(( m * 6 / 10 ))
            convert -size "$1x$2" xc:white \( "$GITHUB_WORKSPACE/public/js-logo.png" -resize "${l}x${l}" \) -gravity center -composite "$f"
          done
          grep -c 'pathPrefix="/partage/"' src/main/AndroidManifest.xml
          ICON="$GITHUB_WORKSPACE/public/js-icon-512.png"
          for pair in mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432; do
            n=${pair%%:*}; rest=${pair#*:}; legacy=${rest%%:*}; adaptive=${rest#*:}
            D="src/main/res/mipmap-$n"
            convert "$ICON" -resize ${legacy}x${legacy} "$D/ic_launcher.png"
            cp "$D/ic_launcher.png" "$D/ic_launcher_round.png"
            convert "$ICON" -resize ${adaptive}x${adaptive} "$D/ic_launcher_foreground.png"
            convert -size ${adaptive}x${adaptive} xc:white "$D/ic_launcher_background.png"
          done
          grep -n 'applicationId' build.gradle | head -2
          grep -n 'app_name' src/main/res/values/strings.xml
      - name: Clé de signature fixe
        run: |
          mkdir -p ~/.android
          cp mobile/android/pp-debug.keystore ~/.android/debug.keystore
      - run: ./gradlew assembleDebug
        working-directory: mobile/android-client
      - uses: actions/upload-artifact@v7
        with:
          name: jardin-signature-android-debug-apk
          path: mobile/android-client/app/build/outputs/apk/debug/app-debug.apk
      - name: Publier la release (APK client)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp mobile/android-client/app/build/outputs/apk/debug/app-debug.apk JardinSignature.apk
          # --latest=false : ne pas écraser la release « latest » de l'appli de gestion (PilotPro.apk)
          gh release view "client-v${VERSION_CODE}" >/dev/null 2>&1 || gh release create "client-v${VERSION_CODE}" JardinSignature.apk --title "Jardin Signature Android ${VERSION_NAME} (build ${VERSION_CODE})" --notes "Installer JardinSignature.apk." --latest=false
          # URL stable pour le bouton de téléchargement de la PWA : la release « client-latest » est mise à jour à chaque build.
          gh release view client-latest >/dev/null 2>&1 || gh release create client-latest --title "Jardin Signature Android (dernière version)" --notes "Dernière version de l'appli client." --latest=false --target "$GITHUB_SHA"
          gh release upload client-latest JardinSignature.apk --clobber
