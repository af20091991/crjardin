name: PP CEEV chart integration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrate configurable CEEV chart
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/routes/_authenticated/pilot.ceev.tsx')
          s = p.read_text()
          marker = 'import { CeevFlexibleChart } from "@/components/pilot/CeevFlexibleChart";'
          if marker not in s:
              s = s.replace('import { PP_COLORS } from "@/lib/pilot-colors";', 'import { PP_COLORS } from "@/lib/pilot-colors";\n' + marker)
          if '<CeevFlexibleChart' not in s:
              start = s.index('      {/* Évolution annuelle */}')
              end = s.index('      {/* Répartition par client', start)
              block = '''      <CeevFlexibleChart\n        year={kpiYear}\n        contracts={yearContracts}\n        revenueSeries={revenueSeries}\n        breakdown={breakdown}\n      />\n\n'''
              s = s[:start] + block + s[end:]
              p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/_authenticated/pilot.ceev.tsx
          git diff --cached --quiet || git commit -m 'feat: add configurable CEEV charts'
          git push
