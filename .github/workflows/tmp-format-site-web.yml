name: Temporary format Site Web
on:
  push:
    branches:
      - adpp/work/site-web-google-final-fix
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun ci
      - run: bunx prettier --write src/components/pilot/SiteWebDashboard.tsx
      - name: Commit formatting
        run: |
          if git diff --quiet -- src/components/pilot/SiteWebDashboard.tsx; then
            echo "No formatting changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/pilot/SiteWebDashboard.tsx
          git commit -m "style: format Site Web dashboard"
          git push
