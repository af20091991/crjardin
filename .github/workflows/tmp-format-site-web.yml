name: Temporary format site-web-api

on:
  push:
    branches:
      - adpp/work/site-web-direct-fallback-fix

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun ci
      - run: bunx prettier src/lib/site-web-api.ts > /tmp/site-web-api.ts
      - run: cat /tmp/site-web-api.ts
