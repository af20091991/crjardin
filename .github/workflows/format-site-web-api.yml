name: Temporary format site web API
on:
  push:
    branches:
      - adpp/work/site-web-google-final-fix
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun ci
      - run: bunx prettier --write supabase/functions/site-web-api/index.ts
      - name: Commit formatted file and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/site-web-api/index.ts .github/workflows/format-site-web-api.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git rm .github/workflows/format-site-web-api.yml
          git commit -m "chore(site-web): apply repository Prettier formatting"
          git push
