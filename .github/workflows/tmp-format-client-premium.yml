name: Temporary format Client Premium
on:
  push:
    branches:
      - tmp/format-client-premium-share
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun ci
      - run: bunx prettier --write src/lib/client-premium.ts
      - name: Commit formatting
        run: |
          if git diff --quiet -- src/lib/client-premium.ts; then
            echo "No formatting changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/client-premium.ts
          git commit -m "style: format Client Premium library"
          git push
