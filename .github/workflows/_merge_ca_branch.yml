name: CA branch merge validation

on:
  push:
    branches:
      - feat/ca-dashboard-refinement

permissions:
  contents: write

jobs:
  merge-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ca-dashboard-refinement
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Merge main, preferring branch changes on conflicts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge origin/main -X ours --no-edit

      - name: Normalize SiteWebViews helpers after merge
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const path = "src/components/pilot/SiteWebViews.tsx";
          let source = fs.readFileSync(path, "utf8");
          const marker = "function LoadingState()";
          const first = source.indexOf(marker);
          const second = source.indexOf(marker, first + marker.length);
          if (first !== -1 && second !== -1) {
            const nextSection = source.indexOf("function formatNumber", second);
            if (nextSection === -1) throw new Error("Cannot locate end of duplicated helper block");
            source = source.slice(0, second) + source.slice(nextSection);
            fs.writeFileSync(path, source);
          }
          NODE
          test "$(grep -c '^function LoadingState()' src/components/pilot/SiteWebViews.tsx)" = "1"
          test "$(grep -c '^function yearStart()' src/components/pilot/SiteWebViews.tsx)" = "1"
          test "$(grep -c '^function yesterday()' src/components/pilot/SiteWebViews.tsx)" = "1"
          test "$(grep -c '^function formatDateLabel' src/components/pilot/SiteWebViews.tsx)" = "1"
          test "$(grep -c '^function formatShortDate' src/components/pilot/SiteWebViews.tsx)" = "1"

      - name: Install dependencies
        run: bun ci

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Tests
        run: bun test

      - name: Build
        run: bun run build

      - name: Formatting check
        run: bunx prettier@3.8.3 --check src/components/pilot/AnnualMonthsTable.tsx src/components/pilot/Calculators.tsx src/lib/__tests__/pilot-ca-month-status.test.ts src/lib/__tests__/pilot-ca-presentation-regression.test.ts src/lib/pilot-ca-month-status.ts

      - name: Verify CA regression guard
        run: |
          ! grep -nE 'reporté|reportées|chargesFixesReportees' src/components/pilot/AnnualMonthsTable.tsx

      - name: Push validated merge
        run: |
          git add -A
          git commit -m "chore(ca): validate dashboard branch" || true
          git push origin HEAD:feat/ca-dashboard-refinement

      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/_merge_ca_branch.yml
          git commit -m "chore(ca): remove temporary merge workflow"
          git push origin HEAD:feat/ca-dashboard-refinement

# Validation trigger: normalization must run before typecheck.
