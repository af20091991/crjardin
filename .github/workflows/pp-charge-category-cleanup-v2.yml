name: PP charge category cleanup v2
on:
  push:
    paths:
      - .github/workflows/pp-charge-category-cleanup-v2.yml
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update charge category UI and mapping
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re
          p = Path('src/routes/_authenticated/pilot.ca.tsx')
          s = p.read_text()

          # Replace only the charge-category helper block; preserve all unrelated CA logic.
          pattern = r'  type ChargeType = .*?\n  const saveChargeType = .*?\n  };'
          replacement = '''  type ChargeType = "Charge fixe" | "Achats" | "Charge chantier" | "Rémunération" | "Investissement";

  const CHARGE_TYPE_META: Record<ChargeType, { charge_class: "fixe" | "variable" | "a_classer"; is_investment: boolean }> = {
    "Charge fixe": { charge_class: "fixe", is_investment: false },
    Achats: { charge_class: "variable", is_investment: false },
    "Charge chantier": { charge_class: "variable", is_investment: false },
    Rémunération: { charge_class: "variable", is_investment: false },
    Investissement: { charge_class: "a_classer", is_investment: true },
  };

  const chargeTypeForRow = (row: CaEntry & { charge_category?: string | null; charge_class?: string | null }) => {
    if (row.is_fixed) return "Charge fixe" as const;
    if (row.is_investment) return "Investissement" as const;
    if (row.kind === "remuneration") return "Rémunération" as const;
    const current = row.charge_category;
    if (["Alimentaire", "Carburant", "Déchèterie"].includes(current ?? "")) return "Charges variables";
    if (current === "Charge de fonctionnement") return "Achats" as const;
    if (current === "Achats" || current === "Charge chantier" || current === "Rémunération") return current as ChargeType;
    if (row.charge_class === "variable") return "Charges variables";
    return null;
  };

  const saveChargeType = (row: CaEntry & { charge_category?: string | null; charge_class?: string | null }, type: ChargeType) => {
    const meta = CHARGE_TYPE_META[type];
    save(row.id, { charge_category: type, charge_class: meta.charge_class, is_investment: meta.is_investment });
  };'''
          s2, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'charge helper block not found exactly once: {n}')
          s = s2

          # Replace the nested variable-charge menu only. This deliberately removes
          # the old Alimentaire/Carburant/Déchèterie choices and adds Rémunération.
          menu_pattern = r'(\s*<DropdownMenuSub>\s*<DropdownMenuSubTrigger>Charges variables</DropdownMenuSubTrigger>\s*<DropdownMenuSubContent.*?</DropdownMenuSubContent>\s*</DropdownMenuSub>)'
          menu_replacement = '''
                                      <DropdownMenuSub>
                                        <DropdownMenuSubTrigger>Charges variables</DropdownMenuSubTrigger>
                                        <DropdownMenuSubContent className="w-72">
                                          <DropdownMenuItem title="Toutes les charges nécessaires au fonctionnement de l'entreprise, autre que les charges de chantier" onSelect={() => saveChargeType(typedRow, "Achats")}>Achats</DropdownMenuItem>
                                          <DropdownMenuItem onSelect={() => saveChargeType(typedRow, "Charge chantier")}>Charge chantier</DropdownMenuItem>
                                          <DropdownMenuItem onSelect={() => saveChargeType(typedRow, "Rémunération")}>Rémunération</DropdownMenuItem>
                                        </DropdownMenuSubContent>
                                      </DropdownMenuSub>'''
          s2, n = re.subn(menu_pattern, menu_replacement, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'variable charge menu not found exactly once: {n}')
          s = s2

          # Remove obsolete local auto-detection usage if still present.
          s = re.sub(r'\s*const autoVariable = detectAutoVariableCharge\(row\.designation\);', '', s)
          if 'detectAutoVariableCharge' in s or 'type AutoVariableCharge' in s:
              raise SystemExit('obsolete automatic category detector remains')
          if 'Charge de fonctionnement' in s:
              raise SystemExit('obsolete Charge de fonctionnement remains')
          if re.search(r'<DropdownMenuItem[^>]*>(?:Alimentaire|Carburant|Déchèterie)</DropdownMenuItem>', s):
              raise SystemExit('obsolete manual variable category remains in menu')

          p.write_text(s)
          PY
          npm run build
          git diff --check
          git config user.name "Pilot Pro Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/_authenticated/pilot.ca.tsx
          git commit -m "feat: simplify charge category choices" || true
          git push
