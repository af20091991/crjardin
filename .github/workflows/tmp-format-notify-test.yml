name: Temporary format notify test

on:
  push:
    branches:
      - feat/client-premium-pdf-upcoming-works

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun ci
      - run: bunx prettier --write src/lib/__tests__/notify-client-cache.test.ts
      - name: Commit formatted test and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/__tests__/notify-client-cache.test.ts
          git rm .github/workflows/tmp-format-notify-test.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style: format notify client test"
          git push
