name: CA temporary formatter
on:
  push:
    branches:
      - feat/ca-dashboard-refinement-v2
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/ca-dashboard-refinement-v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Format CA files and remove workflow
        run: |
          bunx prettier --write \
            src/components/pilot/AnnualMonthsTable.tsx \
            src/components/pilot/CaSection.tsx \
            src/components/pilot/Calculators.tsx \
            src/lib/__tests__/pilot-ca-hourly-rate.test.ts \
            src/lib/__tests__/pilot-ca-month-status.test.ts \
            src/lib/__tests__/pilot-ca-presentation-regression.test.ts \
            src/lib/pilot-ca-hourly-rate.ts \
            src/lib/pilot-ca-month-status.ts \
            src/routes/_authenticated/pilot.ca.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ca-temporary-formatter.yml
          git add src/components/pilot/AnnualMonthsTable.tsx src/components/pilot/CaSection.tsx src/components/pilot/Calculators.tsx src/lib/__tests__/pilot-ca-hourly-rate.test.ts src/lib/__tests__/pilot-ca-month-status.test.ts src/lib/__tests__/pilot-ca-presentation-regression.test.ts src/lib/pilot-ca-hourly-rate.ts src/lib/pilot-ca-month-status.ts src/routes/_authenticated/pilot.ca.tsx
          git commit -m "style(pilot): formater le chantier chiffre d'affaires"
          git push origin HEAD:feat/ca-dashboard-refinement-v2
