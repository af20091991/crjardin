name: Temporary charge hierarchy patch
on:
  push:
    paths:
      - .github/workflows/temporary-charge-hierarchy.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply charge hierarchy
        run: |
          python3 <<'PY'
          from pathlib import Path

          page = Path('src/routes/_authenticated/pilot.ca.tsx')
          s = page.read_text()

          old_import = '''  DropdownMenu,
  DropdownMenuContent,
  DropdownMenuItem,
  DropdownMenuTrigger,
} from "@/components/ui/dropdown-menu";'''
          new_import = '''  DropdownMenu,
  DropdownMenuContent,
  DropdownMenuItem,
  DropdownMenuSub,
  DropdownMenuSubContent,
  DropdownMenuSubTrigger,
  DropdownMenuSeparator,
  DropdownMenuTrigger,
} from "@/components/ui/dropdown-menu";'''
          if old_import not in s:
              raise SystemExit('dropdown import block not found')
          s = s.replace(old_import, new_import, 1)

          old_types = '''  type ChargeType =
    | "Charge fixe"
    | "Alimentaire"
    | "Déchèterie"
    | "Carburant"
    | "Investissement"
    | "Charge de fonctionnement"
    | "Achats"
    | "Charge chantier";

  const CHARGE_TYPES: ChargeType[] = [
    "Charge fixe",
    "Alimentaire",
    "Déchèterie",
    "Carburant",
    "Investissement",
    "Charge de fonctionnement",
    "Achats",
    "Charge chantier",
  ];

  const CHARGE_TYPE_META: Record<ChargeType, { charge_class: "fixe" | "variable" | "a_classer"; is_investment: boolean }> = {
    "Charge fixe": { charge_class: "fixe", is_investment: false },
    Alimentaire: { charge_class: "variable", is_investment: false },
    "Déchèterie": { charge_class: "variable", is_investment: false },
    Carburant: { charge_class: "variable", is_investment: false },
    Investissement: { charge_class: "a_classer", is_investment: true },
    "Charge de fonctionnement": { charge_class: "a_classer", is_investment: false },
    Achats: { charge_class: "a_classer", is_investment: false },
    "Charge chantier": { charge_class: "a_classer", is_investment: false },
  };

  const chargeTypeForRow = (row: CaEntry & { charge_category?: string | null; charge_class?: string | null }) => {
    if (row.is_fixed) return "Charge fixe" as const;
    const current = row.charge_category;
    return CHARGE_TYPES.includes(current as ChargeType) ? (current as ChargeType) : null;
  };

  const saveChargeType = (row: CaEntry & { charge_category?: string | null; charge_class?: string | null }, type: ChargeType) => {
    const meta = CHARGE_TYPE_META[type];
    save(row.id, {
      charge_category: type,
      charge_class: meta.charge_class,
      is_investment: meta.is_investment,
    } as never);
  };'''
          new_types = '''  type ChargeType = "Charge fixe" | "Achats" | "Charge chantier" | "Investissement";
  type AutoVariableCharge = "Alimentaire" | "Carburant" | "Déchèterie";

  const CHARGE_TYPE_META: Record<ChargeType, { charge_class: "fixe" | "variable" | "a_classer"; is_investment: boolean }> = {
    "Charge fixe": { charge_class: "fixe", is_investment: false },
    Achats: { charge_class: "variable", is_investment: false },
    "Charge chantier": { charge_class: "variable", is_investment: false },
    Investissement: { charge_class: "a_classer", is_investment: true },
  };

  const detectAutoVariableCharge = (designation: string | null | undefined): AutoVariableCharge | null => {
    const value = (designation ?? "").normalize("NFD").replace(/[\\u0300-\\u036f]/g, "").toLowerCase();
    if (/\\b(carburant|essence|gazole|gasoil|diesel|sp95|sp98|e10|e85|adblue)\\b/.test(value)) return "Carburant";
    if (/\\b(dechetterie|dechet|dechets|decharge|benne|gravats|evacuation)\\b/.test(value)) return "Déchèterie";
    if (/\\b(alimentaire|alimentation|repas|restaurant|dejeuner|diner|nourriture|supermarche)\\b/.test(value)) return "Alimentaire";
    return null;
  };

  const chargeTypeForRow = (row: CaEntry & { charge_category?: string | null; charge_class?: string | null }) => {
    if (row.is_fixed) return "Charge fixe" as const;
    if (row.is_investment) return "Investissement" as const;
    const current = row.charge_category;
    if (current === "Charge de fonctionnement") return "Achats" as const;
    if (current === "Achats" || current === "Charge chantier") return current as ChargeType;
    const auto = detectAutoVariableCharge(row.designation);
    if (auto) return `Charges variables · ${auto}`;
    return null;
  };

  const saveChargeType = (row: CaEntry & { charge_category?: string | null; charge_class?: string | null }, type: ChargeType) => {
    const meta = CHARGE_TYPE_META[type];
    save(row.id, {
      charge_category: type,
      charge_class: meta.charge_class,
      is_investment: meta.is_investment,
    });
  };'''
          if old_types not in s:
              raise SystemExit('charge type block not found')
          s = s.replace(old_types, new_types, 1)

          old_cell = '''                            <TableCell>
                              {isFixed ? (
                                <span className="text-sm font-medium text-muted-foreground">Charge fixe</span>
                              ) : (
                                <Select
                                  value={chargeTypeForRow(row as CaEntry & { charge_category?: string | null; charge_class?: string | null }) ?? ""}
                                  onValueChange={(value) => saveChargeType(row as CaEntry & { charge_category?: string | null; charge_class?: string | null }, value as ChargeType)}
                                >
                                  <SelectTrigger className="h-8">
                                    <SelectValue placeholder="Choisir…" />
                                  </SelectTrigger>
                                  <SelectContent>
                                    {CHARGE_TYPES.map((type) => (
                                      <SelectItem key={type} value={type}>
                                        {type}
                                      </SelectItem>
                                    ))}
                                  </SelectContent>
                                </Select>
                              )}
                            </TableCell>'''
          new_cell = '''                            <TableCell>
                              {isFixed ? (
                                <span className="text-sm font-medium text-muted-foreground">Charge fixe</span>
                              ) : (() => {
                                const typedRow = row as CaEntry & { charge_category?: string | null; charge_class?: string | null };
                                const selectedType = chargeTypeForRow(typedRow);
                                const autoVariable = detectAutoVariableCharge(row.designation);
                                const displayType = selectedType ?? "Choisir…";
                                const selectType = (type: ChargeType) => saveChargeType(typedRow, type);
                                return (
                                  <DropdownMenu>
                                    <DropdownMenuTrigger asChild>
                                      <button type="button" className="flex h-8 w-full items-center justify-between rounded-md border border-input bg-transparent px-3 text-left text-sm hover:bg-muted/40">
                                        <span className={selectedType ? "" : "text-muted-foreground"}>{displayType}</span>
                                        <ChevronDown className="h-4 w-4 shrink-0 opacity-50" />
                                      </button>
                                    </DropdownMenuTrigger>
                                    <DropdownMenuContent align="start" className="w-64">
                                      <DropdownMenuItem onSelect={() => selectType("Charge fixe")}>Charge fixe</DropdownMenuItem>
                                      <DropdownMenuSub>
                                        <DropdownMenuSubTrigger>Charges variables</DropdownMenuSubTrigger>
                                        <DropdownMenuSubContent className="w-72">
                                          <div className="px-2 py-1.5 text-xs text-muted-foreground">
                                            Alimentaire, carburant et déchèterie sont détectés automatiquement d'après la désignation.
                                          </div>
                                          <DropdownMenuSeparator />
                                          {autoVariable && (
                                            <div className="px-2 py-1.5 text-xs text-muted-foreground">
                                              Détection actuelle : <span className="font-medium text-foreground">{autoVariable}</span>
                                            </div>
                                          )}
                                          <DropdownMenuItem onSelect={() => selectType("Achats")}>Achats</DropdownMenuItem>
                                          <DropdownMenuItem onSelect={() => selectType("Charge chantier")}>Charge chantier</DropdownMenuItem>
                                        </DropdownMenuSubContent>
                                      </DropdownMenuSub>
                                      <DropdownMenuItem onSelect={() => selectType("Investissement")}>Investissement</DropdownMenuItem>
                                    </DropdownMenuContent>
                                  </DropdownMenu>
                                );
                              })()}
                            </TableCell>'''
          if old_cell not in s:
              raise SystemExit('charge selector cell not found')
          s = s.replace(old_cell, new_cell, 1)

          page.write_text(s)

          lib = Path('src/lib/pilot-ca.ts')
          s = lib.read_text()
          old_input = '''  client_id?: string | null;
  intervention_type?: InterventionKind | null;
};'''
          new_input = '''  client_id?: string | null;
  intervention_type?: InterventionKind | null;
  charge_category?: string | null;
  charge_class?: "fixe" | "variable" | "a_classer" | null;
  is_investment?: boolean | null;
};'''
          if old_input not in s:
              raise SystemExit('CaEntryInput insertion point not found')
          s = s.replace(old_input, new_input, 1)
          old_entry = '''  /** Date comptable de la ligne, quand elle est connue (borne au jour près). */
  entry_date?: string | null;'''
          new_entry = '''  /** Classification de charge utilisée par la page Chiffre d'affaires. */
  charge_category?: string | null;
  charge_class?: "fixe" | "variable" | "a_classer" | null;
  /** Date comptable de la ligne, quand elle est connue (borne au jour près). */
  entry_date?: string | null;'''
          if old_entry not in s:
              raise SystemExit('CaEntry insertion point not found')
          s = s.replace(old_entry, new_entry, 1)
          lib.write_text(s)

          # Visible functional change: add one concise changelog entry.
          cl = Path('src/lib/changelog.ts')
          s = cl.read_text()
          marker = 'export const CHANGELOG: ChangeEntry[] = ['
          entry = '''export const CHANGELOG: ChangeEntry[] = [
  {
    date: "2026-08-27",
    version: "2.3.1",
    theme: "Général",
    title: "Chiffre d'affaires — hiérarchie des charges",
    details: [
      "La colonne Type de charge distingue désormais Charges fixes, Charges variables et Investissements avec un sous-menu de classement.",
      "Alimentaire, carburant et déchèterie sont détectés automatiquement à partir de la désignation ; Achats et Charge chantier restent sélectionnables.",
      "Le type Investissement conserve son traitement comptable hors résultat mensuel et son rattachement à l'exercice.",
    ],
  },'''
          if marker not in s:
              raise SystemExit('changelog marker not found')
          s = s.replace(marker, entry, 1)
          cl.write_text(s)
          PY
          git diff --check
          git diff -- src/routes/_authenticated/pilot.ca.tsx src/lib/pilot-ca.ts src/lib/changelog.ts
          git add src/routes/_authenticated/pilot.ca.tsx src/lib/pilot-ca.ts src/lib/changelog.ts
          git config user.name "Pilot Pro Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: organize CA charge categories"
          git push
          rm -f .github/workflows/temporary-charge-hierarchy.yml
          git add .github/workflows/temporary-charge-hierarchy.yml
          git commit -m "chore: remove temporary charge hierarchy workflow"
          git push
