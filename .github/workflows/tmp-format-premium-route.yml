name: Temporary format Premium route

on:
  push:
    branches:
      - feat/client-premium-pdf-upcoming-works

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun ci
      - run: bunx prettier --write 'src/routes/_authenticated/clients.$clientId.premium.tsx'
      - name: Commit formatted route and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'src/routes/_authenticated/clients.$clientId.premium.tsx'
          git rm .github/workflows/tmp-format-premium-route.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(premium): format Premium route with repository Prettier"
          git push
