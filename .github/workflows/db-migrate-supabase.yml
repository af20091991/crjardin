name: DB migrations (Supabase wdygs)

on:
  workflow_dispatch:

concurrency:
  group: db-migrate-supabase
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: wdygsbmivqxvgkgpbrqc
      SUPABASE_POOLER_HOST: aws-0-eu-central-1.pooler.supabase.com
    steps:
      - uses: actions/checkout@v4

      - name: Installer psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Appliquer chaque migration dans sa transaction (rapport des échecs)
        run: |
          PASS_ENC=$(python3 -c 'import urllib.parse,os;print(urllib.parse.quote(os.environ["SUPABASE_DB_PASSWORD"],safe=""))')
          DB_URL="postgresql://postgres.${SUPABASE_PROJECT_REF}:${PASS_ENC}@${SUPABASE_POOLER_HOST}:5432/postgres"
          mkdir -p migration-report
          : > migration-report/rapport.txt
          OK=0; KO=0
          for f in $(ls supabase/migrations/*.sql | sort); do
            if psql "$DB_URL" -X -q -v ON_ERROR_STOP=1 -1 -f "$f" > migration-report/last.txt 2>&1; then
              OK=$((OK+1)); echo "OK     $(basename "$f")" >> migration-report/rapport.txt
            else
              KO=$((KO+1)); echo "ECHEC  $(basename "$f") :: $(grep -m1 'ERROR' migration-report/last.txt)" >> migration-report/rapport.txt
            fi
          done
          echo "Réussies: $OK  Échouées: $KO"
          grep -v "^OK" migration-report/rapport.txt || true
          cat migration-report/rapport.txt

      - name: Publier le rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-migrations
          path: migration-report/rapport.txt
