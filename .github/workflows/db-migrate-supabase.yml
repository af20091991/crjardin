name: DB migrations (Supabase wdygs)

on:
  workflow_dispatch:

concurrency:
  group: db-migrate-supabase
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: wdygsbmivqxvgkgpbrqc
      SUPABASE_POOLER_HOST: aws-0-eu-central-1.pooler.supabase.com
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Appliquer les migrations sur wdygs (connexion pooler IPv4)
        run: |
          PASS_ENC=$(python3 -c 'import urllib.parse,os;print(urllib.parse.quote(os.environ["SUPABASE_DB_PASSWORD"],safe=""))')
          DB_URL="postgresql://postgres.${SUPABASE_PROJECT_REF}:${PASS_ENC}@${SUPABASE_POOLER_HOST}:5432/postgres"
          supabase db push --db-url "$DB_URL" --include-all --yes
