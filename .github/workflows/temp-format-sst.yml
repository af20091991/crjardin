name: Temporary SST calendar formatter

on:
  push:
    branches:
      - adpp/sst-calendrier-planning-retour-experience

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx prettier --write src/routes/_authenticated/pilot.calendrier.tsx
      - name: Commit formatting
        run: |
          if git diff --quiet -- src/routes/_authenticated/pilot.calendrier.tsx; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/_authenticated/pilot.calendrier.tsx
          git commit -m "chore: format SST calendar"
          git push
