name: TMP format dashboard 2

on:
  push:
    branches:
      - adpp/work/site-web-real-data-final

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun ci
      - run: bunx prettier --write src/components/pilot/SiteWebDashboard.tsx
      - name: Commit exact Prettier output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/pilot/SiteWebDashboard.tsx
          git diff --cached --quiet && exit 0
          git commit -m "style(site-web): apply exact prettier formatting"
          git push
