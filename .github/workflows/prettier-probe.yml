name: Temporary Prettier Probe

on:
  push:
    branches:
      - "fix/fiches-sst-multi-duplicate-pdf"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun ci
      - name: Format changed PP files and print results
        run: |
          files=(
            "src/components/WorksiteSheetForm.tsx"
            "src/lib/changelog.ts"
            "src/lib/worksite-pdf-complete.ts"
            "src/lib/worksite-sst.ts"
            "src/routes/_authenticated/fiches.\$ficheId.tsx"
            "src/routes/_authenticated/fiches.index.tsx"
          )
          bunx prettier --write "${files[@]}"
          for file in "${files[@]}"; do
            echo "===== $file ====="
            cat "$file"
          done
