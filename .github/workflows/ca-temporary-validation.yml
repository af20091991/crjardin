name: CA temporary validation
on:
  push:
    branches:
      - feat/ca-dashboard-refinement-v2
permissions:
  contents: write
jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/ca-dashboard-refinement-v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun ci
      - name: Format changed CA files
        run: bunx prettier --check src/components/pilot/AnnualMonthsTable.tsx src/components/pilot/CaSection.tsx src/components/pilot/Calculators.tsx src/lib/__tests__/pilot-ca-hourly-rate.test.ts src/lib/__tests__/pilot-ca-month-status.test.ts src/lib/__tests__/pilot-ca-presentation-regression.test.ts src/lib/pilot-ca-hourly-rate.ts src/lib/pilot-ca-month-status.ts src/routes/_authenticated/pilot.ca.tsx
      - name: TypeScript
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Tests
        run: bun test
      - name: Production build
        run: bun run build
      - name: Remove temporary validation workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ca-temporary-validation.yml
          git commit -m "chore(ci): remove temporary CA validation"
          git push origin HEAD:feat/ca-dashboard-refinement-v2
