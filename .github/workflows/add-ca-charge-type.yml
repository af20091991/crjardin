name: Add CA charge type
on:
  push:
    branches: [main]
    paths: [.github/workflows/add-ca-charge-type.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update CA charge table
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('src/routes/_authenticated/pilot.ca.tsx')
          s = p.read_text()
          original = s

          # Use the existing persisted charge_category / charge_class / is_investment
          # fields. No schema change is required.
          marker = '  const chargeCols = useColumnWidths("pilot-ca-charges", {'
          if 'type: 190,' not in s:
              s = s.replace(marker, marker + '\n    type: 190,', 1)

          helper_marker = '  const save = (id: string, input: Partial<CaEntry>) => updateMut.mutate({ id, input });\n'
          helper = '''  type ChargeType =\n    | "Charge fixe"\n    | "Alimentaire"\n    | "Déchèterie"\n    | "Carburant"\n    | "Investissement"\n    | "Charge de fonctionnement"\n    | "Achats"\n    | "Charge chantier";\n\n  const CHARGE_TYPES: ChargeType[] = [\n    "Charge fixe",\n    "Alimentaire",\n    "Déchèterie",\n    "Carburant",\n    "Investissement",\n    "Charge de fonctionnement",\n    "Achats",\n    "Charge chantier",\n  ];\n\n  const CHARGE_TYPE_META: Record<ChargeType, { charge_class: "fixe" | "variable" | "a_classer"; is_investment: boolean }> = {\n    "Charge fixe": { charge_class: "fixe", is_investment: false },\n    Alimentaire: { charge_class: "variable", is_investment: false },\n    "Déchèterie": { charge_class: "variable", is_investment: false },\n    Carburant: { charge_class: "variable", is_investment: false },\n    Investissement: { charge_class: "a_classer", is_investment: true },\n    "Charge de fonctionnement": { charge_class: "a_classer", is_investment: false },\n    Achats: { charge_class: "a_classer", is_investment: false },\n    "Charge chantier": { charge_class: "a_classer", is_investment: false },\n  };\n\n  const chargeTypeForRow = (row: CaEntry & { charge_category?: string | null; charge_class?: string | null }) => {\n    if (row.is_fixed) return "Charge fixe" as const;\n    const current = row.charge_category;\n    return CHARGE_TYPES.includes(current as ChargeType) ? (current as ChargeType) : null;\n  };\n\n  const saveChargeType = (row: CaEntry & { charge_category?: string | null; charge_class?: string | null }, type: ChargeType) => {\n    const meta = CHARGE_TYPE_META[type];\n    save(row.id, {\n      charge_category: type,\n      charge_class: meta.charge_class,\n      is_investment: meta.is_investment,\n    } as never);\n  };\n\n'''
          if 'const CHARGE_TYPE_META' not in s:
              if helper_marker not in s: raise SystemExit('save marker not found')
              s = s.replace(helper_marker, helper_marker + '\n' + helper, 1)

          # Replace the charge table colgroup with a four-column structure.
          old_colgroup = '''                  <colgroup>\n                    <col style={{ width: chargeCols.widths.designation }} />\n                    <col style={{ width: chargeCols.widths.montant }} />\n                    <col style={{ width: chargeCols.widths.actions }} />\n                  </colgroup>'''
          new_colgroup = '''                  <colgroup>\n                    <col style={{ width: chargeCols.widths.designation }} />\n                    <col style={{ width: chargeCols.widths.type }} />\n                    <col style={{ width: chargeCols.widths.montant }} />\n                    <col style={{ width: chargeCols.widths.actions }} />\n                  </colgroup>'''
          if old_colgroup not in s: raise SystemExit('charge colgroup not found')
          s = s.replace(old_colgroup, new_colgroup, 1)

          # Add the new header immediately after Désignation.
          old_head = '''                      <TableHead className="relative">\n                        Désignation\n                        <ResizeHandle\n                          width={chargeCols.widths.designation}\n                          onResize={(w) => chargeCols.setWidth("designation", w)}\n                        />\n                      </TableHead>'''
          new_head = old_head + '''\n                      <TableHead className="relative">\n                        Type de charge\n                        <ResizeHandle\n                          width={chargeCols.widths.type}\n                          onResize={(w) => chargeCols.setWidth("type", w)}\n                        />\n                      </TableHead>'''
          if old_head not in s: raise SystemExit('charge designation header not found')
          s = s.replace(old_head, new_head, 1)

          # Insert the type cell between designation and amount.
          amount_marker = '                            <TableCell className="text-right">\n                              {isFixed ? ('
          idx = s.find(amount_marker)
          if idx < 0: raise SystemExit('charge amount cell not found')
          type_cell = '''                            <TableCell>\n                              {isFixed ? (\n                                <span className="text-sm font-medium text-muted-foreground">Charge fixe</span>\n                              ) : (\n                                <Select\n                                  value={chargeTypeForRow(row as CaEntry & { charge_category?: string | null; charge_class?: string | null }) ?? ""}\n                                  onValueChange={(value) => saveChargeType(row as CaEntry & { charge_category?: string | null; charge_class?: string | null }, value as ChargeType)}\n                                >\n                                  <SelectTrigger className="h-8">\n                                    <SelectValue placeholder="Choisir…" />\n                                  </SelectTrigger>\n                                  <SelectContent>\n                                    {CHARGE_TYPES.map((type) => (\n                                      <SelectItem key={type} value={type}>\n                                        {type}\n                                      </SelectItem>\n                                    ))}\n                                  </SelectContent>\n                                </Select>\n                              )}\n                            </TableCell>\n\n'''
          s = s[:idx] + type_cell + s[idx:]

          # Charge detail/comment rows span the new column too.
          s = s.replace('<TableCell colSpan={3} className="py-2">', '<TableCell colSpan={4} className="py-2">')
          s = s.replace('<TableCell colSpan={3} className="py-1">', '<TableCell colSpan={4} className="py-1">')
          s = s.replace('<TableCell colSpan={3} className="bg-muted/20 py-2">', '<TableCell colSpan={4} className="bg-muted/20 py-2">')

          # Keep investment behavior explicit: it is already excluded from monthly
          # charges by is_investment and included in the exercise result by the existing engine.
          if s == original: raise SystemExit('No change produced')
          p.write_text(s)
          PY
          git diff --check
          git add src/routes/_authenticated/pilot.ca.tsx
          git diff --cached --stat
          git config user.name 'Pilot Pro Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add charge type column to CA charges'
          git push

      - name: Remove temporary workflow
        if: success()
        run: |
          rm -f .github/workflows/add-ca-charge-type.yml
          git config user.name 'Pilot Pro Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/add-ca-charge-type.yml
          git commit -m 'chore: remove temporary CA charge workflow'
          git push
