name: ADPP Prettier Autofix

on:
  push:
    branches:
      - 'fix/**'

permissions:
  contents: write

concurrency:
  group: adpp-prettier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format AppShell
        run: bunx prettier --write src/components/AppShell.tsx

      - name: Silence intentional fast-refresh export warnings
        run: |
          sed -i '/^export const DEFAULT_OPEN_GROUP/i\\// eslint-disable-next-line react-refresh/only-export-components' src/components/AppShell.tsx
          sed -i '/^export function filterNavItems/i\\// eslint-disable-next-line react-refresh/only-export-components' src/components/AppShell.tsx

      - name: Commit formatting only when needed
        run: |
          if git diff --quiet -- src/components/AppShell.tsx; then
            echo "AppShell.tsx is already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/AppShell.tsx
          git commit -m "chore: silence intentional AppShell export warnings"
          git push
