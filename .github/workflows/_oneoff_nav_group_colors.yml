name: oneoff-nav-group-colors

on:
  push:
    branches: ["adpp/nav-rubriques-couleurs"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply navigation group styling
        shell: bash
        run: |
          cat >> src/styles.css <<'EOF'

/* Pilot Pro — différenciation visuelle des rubriques de navigation */
[data-shell="nav"] [data-nav-group="Entreprise"] { --nav-group-color: var(--brand-green); }
[data-shell="nav"] [data-nav-group="Financier"] { --nav-group-color: var(--brand-blue); }
[data-shell="nav"] [data-nav-group="Client"] { --nav-group-color: var(--brand-brown); }
[data-shell="nav"] [data-nav-group="Activité"] { --nav-group-color: var(--brand-orange); }
[data-shell="nav"] [data-nav-group="Configuration"] { --nav-group-color: var(--brand-bark); }

[data-shell="nav"] [data-nav-group] {
  border-left: 3px solid color-mix(in oklab, var(--nav-group-color) 32%, transparent);
  border-radius: 0.45rem;
  background: color-mix(in oklab, var(--nav-group-color) 4%, transparent);
  padding-left: 0.25rem;
}

[data-shell="nav"] [data-nav-group] [data-shell="nav-group-title"] {
  color: var(--nav-group-color);
  background: color-mix(in oklab, var(--nav-group-color) 14%, var(--card));
  font-size: 0.74rem;
  font-weight: 700;
  letter-spacing: 0.045em;
  border: 1px solid color-mix(in oklab, var(--nav-group-color) 18%, transparent);
}

[data-shell="nav"] [data-nav-group] [data-shell="nav-group-title"]:hover {
  color: var(--nav-group-color);
  background: color-mix(in oklab, var(--nav-group-color) 20%, var(--card));
}
EOF

          git rm .github/workflows/_oneoff_nav_group_colors.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/styles.css .github/workflows/_oneoff_nav_group_colors.yml
          git commit -m "style(nav): color-code Pilot Pro sections"
          git push origin HEAD:adpp/nav-rubriques-couleurs
