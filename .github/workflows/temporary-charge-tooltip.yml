name: Temporary charge tooltip patch
on:
  push:
    paths:
      - .github/workflows/temporary-charge-tooltip.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add charge category help text
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('src/routes/_authenticated/pilot.ca.tsx')
          s=p.read_text()
          old='''                                      <DropdownMenuItem onSelect={() => saveChargeType(typedRow, "Achats")}>Achats</DropdownMenuItem>\n                                          <DropdownMenuItem onSelect={() => saveChargeType(typedRow, "Charge chantier")}>Charge chantier</DropdownMenuItem>'''
          new='''                                      <DropdownMenuItem title="Toutes les charges nécessaires au fonctionnement de l'entreprise, autre que les charges de chantier" onSelect={() => saveChargeType(typedRow, "Achats")}>Achats</DropdownMenuItem>\n                                          <DropdownMenuItem onSelect={() => saveChargeType(typedRow, "Charge chantier")}>Charge chantier</DropdownMenuItem>'''
          if old not in s: raise SystemExit('Achats menu item not found')
          s=s.replace(old,new,1)
          old='''                                      <DropdownMenuItem onSelect={() => saveChargeType(typedRow, "Investissement")}>Investissement</DropdownMenuItem>'''
          new='''                                      <DropdownMenuItem title="Apparaît dans le mois en cours mais n'impacte pas le résultat du mois. L'investissement est rapporté à l'exercice, pas au mois auquel il a été affecté." onSelect={() => saveChargeType(typedRow, "Investissement")}>Investissement</DropdownMenuItem>'''
          if old not in s: raise SystemExit('Investissement menu item not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git diff --check
          git add src/routes/_authenticated/pilot.ca.tsx
          git config user.name "Pilot Pro Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: add charge category help text"
          git push
          rm -f .github/workflows/temporary-charge-tooltip.yml
          git add .github/workflows/temporary-charge-tooltip.yml
          git commit -m "chore: remove temporary charge tooltip workflow"
          git push
