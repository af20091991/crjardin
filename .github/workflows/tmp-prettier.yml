name: Temporary Prettier Formatter

on:
  push:
    branches:
      - tmp/prettier-site-web

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun ci
      - run: bunx prettier --write src/components/pilot/SiteWebViews.tsx
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-site-web
          path: src/components/pilot/SiteWebViews.tsx
