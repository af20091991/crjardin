name: Temporary format SST map regression test
on:
  push:
    branches:
      - chore/lock-sst-pdf-map-regression-20260925
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun ci
      - run: bunx prettier --write src/lib/__tests__/google-static-map-pdf.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet -- src/lib/__tests__/google-static-map-pdf.test.ts; then
            echo "No formatting changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/__tests__/google-static-map-pdf.test.ts
          git commit -m "style(test): format Static Maps regression test"
          git push
