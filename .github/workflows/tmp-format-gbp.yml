name: Temporary GBP formatter

on:
  push:
    branches:
      - adpp/work/site-web-gbp-api-correction

permissions:
  contents: write

jobs:
  format:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore: format GBP API') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun ci
      - run: bunx prettier --write supabase/functions/site-web-api/index.ts
      - name: Commit formatted file
        run: |
          if git diff --quiet -- supabase/functions/site-web-api/index.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/site-web-api/index.ts
          git commit -m "chore: format GBP API"
          git push origin HEAD:${{ github.ref_name }}
