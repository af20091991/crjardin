name: Temporary Premium formatting

on:
  push:
    branches:
      - adpp/premium-carnet-jardin-final

permissions:
  contents: write

jobs:
  format:
    if: ${{ github.event.head_commit.message != 'style(premium): format partage route' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun ci
      - run: bunx prettier --write 'src/routes/partage.$token.tsx'
      - name: Commit formatted route
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- src/routes/partage.$token.tsx; then
            exit 0
          fi
          git add src/routes/partage.$token.tsx
          git commit -m "style(premium): format partage route"
          git push
# trigger
