name: tmp-premium-format

on:
  workflow_dispatch:
  push:
    branches:
      - feat/premium-client-account

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/premium-client-account
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun ci
      - run: bunx prettier --write src/components/PremiumClientDashboard.tsx
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/PremiumClientDashboard.tsx
          git diff --cached --quiet && exit 0
          git commit -m "chore: format Premium client dashboard"
          git push origin HEAD:feat/premium-client-account
