name: Temporary Premium formatter

on:
  push:
    branches:
      - feat/premium-real-features

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun ci
      - run: bunx prettier --write 'src/routes/partage.$token.tsx'
      - name: Commit formatting
        run: |
          if git diff --quiet -- 'src/routes/partage.$token.tsx'; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'src/routes/partage.$token.tsx'
          git commit -m "style(premium): apply Prettier formatting"
          git push