name: Directeur IA — contrôle de build

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/directeur-ia]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier TypeScript / build
        run: npm run build
