name: Temporary format fix

on:
  push:
    branches:
      - adpp/parc-materiel-simple-maintenance

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx prettier --write src/components/pilot/parc-materiel/CompleteMaintenanceDialog.tsx
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/pilot/parc-materiel/CompleteMaintenanceDialog.tsx
          git diff --cached --quiet || git commit -m "chore(parc): format completion dialog"
          git push
