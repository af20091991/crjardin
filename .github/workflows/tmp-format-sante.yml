name: Temporary Santé formatter

on:
  push:
    branches:
      - tmp/format-sante-activite

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun ci
      - run: bunx prettier --write src/routes/_authenticated/pilot.sante.tsx
      - name: Commit formatted file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/_authenticated/pilot.sante.tsx
          git diff --cached --quiet || git commit -m "chore: format Santé activity page"
          git push
