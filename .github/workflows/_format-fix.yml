name: Temporary format cleanup
on:
  push:
    branches: [adpp/work/refonte-fiches-clients]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_format-fix.yml
          git commit -m "chore: remove temporary formatter"
          git push
