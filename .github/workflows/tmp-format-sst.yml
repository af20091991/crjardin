name: Temporary SST formatter

on:
  push:
    branches:
      - adpp/sst-pdf-map-rebuild-20260924

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - name: Format SST PDF files
        run: bunx prettier --write src/lib/maps.functions.ts src/lib/worksite-pdf.ts src/lib/worksite-pdf-complete.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/maps.functions.ts src/lib/worksite-pdf.ts src/lib/worksite-pdf-complete.ts
          if git diff --cached --quiet; then
            echo "Already formatted"
          else
            git commit -m "style: format SST PDF files"
            git push
          fi
