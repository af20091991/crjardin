name: ADPP Validation

on:
  push:
    branches:
      - adpp/site-web-api
  pull_request:
    branches:
      - feature/directeur-ia
      - lovable-sync
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit to validate
        required: true
        default: adpp/site-web-api
  repository_dispatch:
    types: [adpp-validate]

permissions:
  contents: read

concurrency:
  group: adpp-validation-${{ github.event.inputs.ref || github.event.client_payload.ref || github.sha }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout requested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.event.client_payload.ref || github.sha }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Build application
        run: npm run build

      - name: Report success
        run: echo "ADPP validation completed successfully for $GITHUB_SHA"
