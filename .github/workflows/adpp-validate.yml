name: ADPP Validation

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "**"
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit to validate
        required: true
        default: main
  repository_dispatch:
    types: [adpp-validate]

permissions:
  contents: read

concurrency:
  group: adpp-validation-${{ github.event.pull_request.number || github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout requested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.event.client_payload.ref || github.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check protected files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/check-protected-files.mjs

      - name: Format check
        run: npm run format:check

      - name: TypeScript check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Validation summary
        run: echo "ADPP validation passed for $GITHUB_SHA"
