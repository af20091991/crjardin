name: ADPP Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "adpp/*"]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit to validate
        required: true
        default: main
  repository_dispatch:
    types: [adpp-validate]

permissions:
  contents: read
  statuses: write

concurrency:
  group: adpp-validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.sha }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  validate:
    name: ADPP Validation / validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout requested revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.inputs.ref || github.event.client_payload.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies from locked Bun graph
        run: bun ci

      - name: Check protected files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/check-protected-files.mjs

      - name: Check SST Google Static Maps contract
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/check-sst-map-contract.mjs

      - name: Format check changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/check-format-changed.mjs

      - name: TypeScript check
        run: bun run typecheck

      - name: Lint changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/check-lint-changed.mjs

      - name: Unit tests
        run: bun test

      - name: Production build
        run: bun run build

      - name: Validation summary
        run: echo "ADPP validation passed for $GITHUB_SHA"

      - name: Publish required status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${STATUS_SHA}" \
            -f state="${STATE}" \
            -f context="ADPP Validation / validate" \
            -f description="ADPP validation ${STATE}"
