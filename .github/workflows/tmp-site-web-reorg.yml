name: ADPP temporary Site Web UX reorganization

on:
  push:
    branches:
      - adpp/work/site-web-ux-reorg

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reorganize Site web UI
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path('.')

          # 1) Move the existing Site web entry from Pilotage to Aujourd'hui.
          p = root / 'src/components/AppShell.tsx'
          s = p.read_text()
          pattern = re.compile(
              r'\n            \{\n'
              r'              to: "/pilot/site-web",\n'
              r'              label: "Site web",\n'
              r'              short: "Site web",\n'
              r'              icon: Globe2,\n'
              r'              exact: false,\n'
              r'              primary: false,\n'
              r'            \},'
          )
          match = pattern.search(s)
          if not match:
              raise SystemExit('Site web nav item not found')
          site_web_item = match.group(0)
          s = s[:match.start()] + s[match.end():]
          today_start = s.index('      label: "Aujourd\'hui",')
          pilotage_start = s.index('      label: "Pilotage",', today_start)
          today = s[today_start:pilotage_start]
          today_end = today.rfind('      ],')
          if today_end < 0:
              raise SystemExit('Today group closing marker not found')
          today = today[:today_end] + site_web_item + '\n' + today[today_end:]
          s = s[:today_start] + today + s[pilotage_start:]
          p.write_text(s)

          # 2) Make SiteWebViewContent optionally hide the connection header,
          # allowing a single connection component to live at Site web root.
          p = root / 'src/components/pilot/SiteWebViews.tsx'
          s = p.read_text()
          old = 'export function SiteWebViewContent({ view }: { view: View }) {\n  return (\n    <div className="space-y-4">\n      <SiteWebGoogleConnection />'
          new = 'export function SiteWebViewContent({\n  view,\n  showConnection = true,\n}: {\n  view: View;\n  showConnection?: boolean;\n}) {\n  return (\n    <div className="space-y-4">\n      {showConnection && <SiteWebGoogleConnection />}'
          if old not in s:
              raise SystemExit('SiteWebViewContent signature not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # 3) Replace only the presentation shell of SiteWebDashboard.
          # No API imports/calls are introduced or changed here.
          p = root / 'src/components/pilot/SiteWebDashboard.tsx'
          dashboard = r'''import { useState } from "react";
          import { Badge } from "@/components/ui/badge";
          import { Card } from "@/components/ui/card";
          import {
            Activity,
            ArrowRight,
            BarChart3,
            CheckCircle2,
            FileText,
            Globe2,
            Lightbulb,
            MapPin,
            Search,
            Settings2,
            Target,
          } from "lucide-react";
          import { SiteWebGoogleConnection } from "@/components/pilot/SiteWebGoogleConnection";
          import { SiteWebOpportunities } from "@/components/pilot/SiteWebOpportunities";
          import { SiteWebStatistics } from "@/components/pilot/SiteWebStatistics";
          import { SiteWebViewContent } from "@/components/pilot/SiteWebViews";
          import { siteWebDemoModel } from "@/lib/site-web-model";

          type ModuleView = "overview" | "statistics" | "seo" | "content" | "priorities";

          const moduleViews: Array<{ id: ModuleView; label: string }> = [
            { id: "overview", label: "Vue d'ensemble" },
            { id: "statistics", label: "Statistiques" },
            { id: "seo", label: "Référencement" },
            { id: "content", label: "Contenus" },
            { id: "priorities", label: "Opportunités & actions" },
          ];

          function StatusPill({ children }: { children: string }) {
            return (
              <Badge variant="outline" className="font-normal text-muted-foreground">
                {children}
              </Badge>
            );
          }

          const cards = [
            {
              title: "Statistiques",
              description: "Trafic et fréquentation du site depuis Google Analytics 4.",
              icon: BarChart3,
              view: "statistics" as ModuleView,
            },
            {
              title: "Référencement",
              description: "Visibilité Google et performance locale, avec les données réellement observées.",
              icon: Search,
              view: "seo" as ModuleView,
            },
            {
              title: "Contenus",
              description: "Inventaire et suivi éditorial, séparés des statistiques Google.",
              icon: FileText,
              view: "content" as ModuleView,
            },
            {
              title: "Opportunités & actions",
              description: "Les points qui méritent une intervention, classés après la mesure.",
              icon: Target,
              view: "priorities" as ModuleView,
            },
          ];

          export function SiteWebDashboard() {
            const [activeView, setActiveView] = useState<ModuleView>("overview");
            const publishedPages = siteWebDemoModel.pages.filter((page) => page.statut === "publie").length;

            return (
              <div className="space-y-6">
                <header className="flex flex-wrap items-start justify-between gap-4">
                  <div className="flex items-start gap-3">
                    <div className="rounded-xl bg-primary/10 p-2.5 text-primary">
                      <Globe2 className="h-5 w-5" />
                    </div>
                    <div>
                      <div className="flex flex-wrap items-center gap-2">
                        <h1 className="font-serif text-2xl font-semibold tracking-tight">Site web</h1>
                        <StatusPill>Google connecté</StatusPill>
                      </div>
                      <p className="mt-1 max-w-2xl text-sm text-muted-foreground">
                        Un espace unique pour comprendre l'audience, la visibilité et les priorités du site.
                      </p>
                    </div>
                  </div>
                  <button
                    type="button"
                    className="inline-flex items-center gap-2 rounded-lg border bg-card px-3 py-2 text-sm font-medium transition-colors hover:bg-muted/50"
                  >
                    <Settings2 className="h-4 w-4" />
                    Paramètres du site
                  </button>
                </header>

                <SiteWebGoogleConnection />

                <nav
                  aria-label="Navigation Site web"
                  className="flex flex-wrap gap-1 border-b border-border pb-1"
                >
                  {moduleViews.map((view) => (
                    <button
                      key={view.id}
                      type="button"
                      onClick={() => setActiveView(view.id)}
                      className={`rounded-t-lg px-3 py-2 text-sm font-medium transition-colors ${
                        activeView === view.id
                          ? "border-b-2 border-primary text-foreground"
                          : "text-muted-foreground hover:bg-muted/40 hover:text-foreground"
                      }`}
                    >
                      {view.label}
                    </button>
                  ))}
                </nav>

                {activeView === "overview" && (
                  <>
                    <Card className="p-5">
                      <div className="flex items-start gap-3">
                        <div className="rounded-lg bg-muted/50 p-2 text-primary">
                          <CheckCircle2 className="h-4 w-4" />
                        </div>
                        <div>
                          <h2 className="font-serif text-xl font-semibold">Vue d'ensemble</h2>
                          <p className="mt-1 text-sm text-muted-foreground">
                            On commence par la situation générale, puis on descend vers les détails et les actions.
                          </p>
                        </div>
                      </div>
                    </Card>

                    <div className="grid gap-4 md:grid-cols-2 xl:grid-cols-4">
                      {cards.map(({ title, description, icon: Icon, view }) => (
                        <Card
                          key={title}
                          className="group flex h-full flex-col p-4 transition-shadow hover:shadow-sm"
                        >
                          <div className="flex items-start justify-between gap-3">
                            <div className="rounded-lg bg-muted/50 p-2 text-primary">
                              <Icon className="h-4 w-4" />
                            </div>
                            <StatusPill>Disponible</StatusPill>
                          </div>
                          <h2 className="mt-4 font-serif text-base font-semibold">{title}</h2>
                          <p className="mt-1 flex-1 text-sm leading-relaxed text-muted-foreground">
                            {description}
                          </p>
                          <button
                            type="button"
                            onClick={() => setActiveView(view)}
                            className="mt-4 inline-flex items-center gap-1 text-xs font-medium text-primary opacity-70 transition-opacity group-hover:opacity-100"
                          >
                            Ouvrir
                            <ArrowRight className="h-3 w-3" />
                          </button>
                        </Card>
                      ))}
                    </div>

                    <div className="grid gap-4 lg:grid-cols-2">
                      <Card className="p-5">
                        <div className="flex items-center gap-3">
                          <FileText className="h-4 w-4 text-muted-foreground" />
                          <div>
                            <p className="text-xs font-medium uppercase tracking-wide text-muted-foreground">Contenus</p>
                            <h2 className="mt-1 font-serif text-lg font-semibold">
                              {publishedPages} pages publiées dans le modèle de contenu
                            </h2>
                          </div>
                        </div>
                      </Card>
                      <Card className="p-5">
                        <div className="flex items-center gap-3">
                          <Lightbulb className="h-4 w-4 text-muted-foreground" />
                          <div>
                            <p className="text-xs font-medium uppercase tracking-wide text-muted-foreground">Lecture</p>
                            <h2 className="mt-1 font-serif text-lg font-semibold">
                              Mesure → analyse → action
                            </h2>
                          </div>
                        </div>
                        <p className="mt-3 text-sm text-muted-foreground">
                          Les détails techniques restent accessibles dans leurs rubriques sans encombrer la vue d'ensemble.
                        </p>
                      </Card>
                    </div>
                  </>
                )}

                {activeView === "statistics" && <SiteWebStatistics />}

                {activeView === "seo" && (
                  <div className="space-y-6">
                    <Card className="p-5">
                      <div className="flex items-start gap-3">
                        <Search className="mt-0.5 h-4 w-4 text-primary" />
                        <div>
                          <h2 className="font-serif text-xl font-semibold">Référencement</h2>
                          <p className="mt-1 text-sm text-muted-foreground">
                            D'abord la visibilité dans Google, puis la performance locale. Les deux volets restent clairement séparés.
                          </p>
                        </div>
                      </div>
                    </Card>
                    <section aria-labelledby="site-web-seo-global">
                      <h3 id="site-web-seo-global" className="mb-3 font-serif text-lg font-semibold">
                        Visibilité dans Google
                      </h3>
                      <SiteWebViewContent view="visibility" showConnection={false} />
                    </section>
                    <section aria-labelledby="site-web-seo-local">
                      <h3 id="site-web-seo-local" className="mb-3 font-serif text-lg font-semibold">
                        Référencement local
                      </h3>
                      <SiteWebViewContent view="local" showConnection={false} />
                    </section>
                  </div>
                )}

                {activeView === "content" && <SiteWebViewContent view="content" showConnection={false} />}

                {activeView === "priorities" && (
                  <div className="space-y-6">
                    <section aria-labelledby="site-web-opportunities">
                      <h2 id="site-web-opportunities" className="mb-3 font-serif text-xl font-semibold">
                        Opportunités
                      </h2>
                      <SiteWebOpportunities />
                    </section>
                    <section aria-labelledby="site-web-actions">
                      <h2 id="site-web-actions" className="mb-3 font-serif text-xl font-semibold">
                        Actions
                      </h2>
                      <SiteWebViewContent view="actions" showConnection={false} />
                    </section>
                  </div>
                )}
              </div>
            );
          }
          '''
          # Strip accidental workflow indentation from the raw string.
          dashboard = '\n'.join(line[10:] if line.startswith('          ') else line for line in dashboard.splitlines()) + '\n'
          p.write_text(dashboard)

          # 4) Remove this temporary workflow from the branch after applying the patch.
          tmp = root / '.github/workflows/tmp-site-web-reorg.yml'
          tmp.unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/AppShell.tsx src/components/pilot/SiteWebViews.tsx src/components/pilot/SiteWebDashboard.tsx .github/workflows/tmp-site-web-reorg.yml
          git commit -m "refactor: reorganize Site web navigation and layout"
          git push
