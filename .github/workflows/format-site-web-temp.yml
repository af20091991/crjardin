name: Temporary site-web formatting

on:
  push:
    branches:
      - adpp/site-web-format-fix

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Format only the files flagged by validation
        run: >-
          bunx prettier --write
          src/components/pilot/SiteWebCommercialEvents.tsx
          src/components/pilot/SiteWebDashboard.tsx
          src/components/pilot/SiteWebSynthesis.tsx
          src/components/pilot/SiteWebTechnicalGeo.tsx
          src/lib/site-web-technical.functions.ts
      - name: Commit formatting-only changes
        run: |
          if git diff --quiet; then
            echo "The files were already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             src/components/pilot/SiteWebCommercialEvents.tsx             src/components/pilot/SiteWebDashboard.tsx             src/components/pilot/SiteWebSynthesis.tsx             src/components/pilot/SiteWebTechnicalGeo.tsx             src/lib/site-web-technical.functions.ts
          git commit -m "style: format site web module files"
          git push origin HEAD:adpp/site-web-format-fix
