name: Finalize active Supabase bridge
on:
  push:
    branches:
      - 'adpp/work/site-web-active-backend-bridge'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Finalize bridge
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          fn = Path('supabase/functions/site-web-api/index.ts')
          text = fn.read_text()
          block = '''const LEGACY_SUPABASE_URL = "https://mgkeqwwzhcodntkakqaz.supabase.co";
          const LEGACY_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1na2Vxd3d6YWhvZG50a2FrcWF6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE0Mjg5NTgsImV4cCI6MjA5NzAwNDk1OH0.eQQP9_GDtzXTP1mF0Vx2QQIe0w0TMhzEQKDDjf6KBcQ";'''
          text = re.sub(r'const LEGACY_SUPABASE_URL = .*?;\nconst LEGACY_SUPABASE_ANON_KEY = .*?;\n(?:\nconst LEGACY_SUPABASE_URL = .*?;\nconst LEGACY_SUPABASE_ANON_KEY = .*?;\n)?', block + '\n\n', text, count=1, flags=re.S)
          fn.write_text(text)

          api = Path('src/lib/site-web-api.ts')
          text = api.read_text()
          pattern = r'async function invoke<T>\(.*?\n\}\n\nexport const getSiteWebConnection'
          replacement = '''async function invoke<T>(
            provider: SiteWebProvider,
            action: string,
            body: Record<string, unknown> = {},
          ): Promise<{ data: T | null; error: string | null }> {
            return invokeDirect<T>(provider, action, body);
          }

          export const getSiteWebConnection'''
          updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Expected invoke block not found')
          api.write_text(updated)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/site-web-api/index.ts src/lib/site-web-api.ts
          git commit -m 'fix(site-web): finalize active backend bridge'
          git push
      - name: Remove one-shot workflow
        run: |
          rm -f .github/workflows/finalize-active-supabase-bridge.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/finalize-active-supabase-bridge.yml
          git commit -m 'chore: remove one-shot bridge workflow'
          git push
