name: ADPP Format Helper

on:
  push:
    branches:
      - 'adpp/work/site-web-format-final'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun ci

      - name: Format Site Web files
        run: bunx prettier --write src/components/pilot/SiteWebDashboard.tsx src/components/pilot/SiteWebGoogleConnection.tsx src/components/pilot/SiteWebOpportunities.tsx supabase/functions/site-web-api/index.ts

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/pilot/SiteWebDashboard.tsx src/components/pilot/SiteWebGoogleConnection.tsx src/components/pilot/SiteWebOpportunities.tsx supabase/functions/site-web-api/index.ts
          git commit -m "style(site-web): apply prettier formatting"
          git push
