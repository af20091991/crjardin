name: Fix CA charge colspan
on:
  push:
    branches: [main]
    paths: [.github/workflows/fix-ca-charge-colspan.yml]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix empty charge table colspan
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/routes/_authenticated/pilot.ca.tsx')
          s = p.read_text()
          old = '<TableCell\n                          colSpan={3}\n                          className="py-6 text-center text-sm text-muted-foreground"'
          new = '<TableCell\n                          colSpan={4}\n                          className="py-6 text-center text-sm text-muted-foreground"'
          if old not in s:
              raise SystemExit('Expected empty-charge colspan not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
          git add src/routes/_authenticated/pilot.ca.tsx
          git config user.name 'Pilot Pro Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: align empty CA charges row with four columns'
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          rm -f .github/workflows/fix-ca-charge-colspan.yml
          git config user.name 'Pilot Pro Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/fix-ca-charge-colspan.yml
          git commit -m 'chore: remove temporary CA charge colspan workflow'
          git push
