name: Temporary Prettier Fix
on:
  push:
    branches:
      - adpp/sst-fiche-prestataire-account-emails
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx prettier --write src/components/SstWorksiteEmailDialog.tsx src/lib/email/sst-send.functions.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/SstWorksiteEmailDialog.tsx src/lib/email/sst-send.functions.ts
          git diff --cached --quiet || git commit -m "chore: format SST email recipient files"
          git push
