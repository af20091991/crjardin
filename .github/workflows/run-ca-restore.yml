name: run-ca-restore
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Exécuter la restauration (COMMIT)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          test -n "$SUPABASE_DB_URL" || { echo "secret absent"; exit 1; }
          sed 's/^ROLLBACK;$/COMMIT;/' supabase/manual/restore_ca_client_links_2026.sql > /tmp/restore.sql
          grep -q '^COMMIT;$' /tmp/restore.sql
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f /tmp/restore.sql
