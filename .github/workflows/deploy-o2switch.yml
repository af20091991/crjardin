name: Deploy O2switch (FTPS)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Installer les dépendances
        run: bun install --frozen-lockfile

      - name: Construire l'application
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: bun run build

      - name: Installer lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Envoyer le build vers O2switch en FTPS explicite
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: |
          test -f .output/server/index.mjs || { echo "Build introuvable : .output/server/index.mjs"; exit 1; }
          date -u +%Y-%m-%dT%H:%M:%SZ > restart.txt
          lftp -e "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate no;
            set ftp:passive-mode true;
            set net:timeout 30;
            set net:max-retries 3;
            set cmd:fail-exit true;
            open -u '$FTP_USER','$FTP_PASSWORD' ftp://$FTP_HOST:21;
            mirror -R --verbose --parallel=2 --only-newer .output/ ${FTP_DIR:-/};
            mkdir -p ${FTP_DIR:-/}/tmp;
            put restart.txt -o ${FTP_DIR:-/}/tmp/restart.txt;
            bye"
      - name: Vérifier que l'application répond avec les bons fichiers
        env:
          PP_URL: https://pp.delagraineaujardin.com
        run: |
          for i in $(seq 1 12); do
            page=$(curl -s -m 30 "$PP_URL/clients" || true)
            js=$(echo "$page" | grep -o '/assets/[^"]*\.js' | head -1)
            if [ -n "$js" ]; then
              type=$(curl -s -o /dev/null -m 30 -w '%{content_type}' "$PP_URL$js" || true)
              case "$type" in
                *javascript*) echo "OK : $js ($type)"; exit 0 ;;
              esac
              echo "Essai $i : $js renvoie $type"
            else
              echo "Essai $i : pas de script trouvé dans la page"
            fi
            sleep 10
          done
          echo "Échec : l'application ne sert pas les bons fichiers après déploiement"
          exit 1
