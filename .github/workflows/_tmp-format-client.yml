name: Temporary client formatter
on:
  push:
    branches:
      - adpp/refonte-fiches-clients-final
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun ci
      - run: bunx prettier --write src/routes/_authenticated/clients.index.tsx
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-client-route
          path: src/routes/_authenticated/clients.index.tsx
