name: mobile-build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["mobile/**"]
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PP_APP_URL: ${{ vars.PP_APP_URL || 'https://crjardin.lovable.app' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: mobile/package-lock.json }
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci --no-audit --no-fund
        working-directory: mobile
      - run: npx cap sync android
        working-directory: mobile
      - name: Version depuis public/mobile-version.json
        run: |
          echo "VERSION_CODE=$(jq -r .latestBuild public/mobile-version.json)" >> $GITHUB_ENV
          echo "VERSION_NAME=$(jq -r .versionName public/mobile-version.json)" >> $GITHUB_ENV
      - name: Clé de signature fixe (mises à jour par-dessus l'installation)
        run: |
          mkdir -p ~/.android
          cp mobile/android/pp-debug.keystore ~/.android/debug.keystore
      - run: ./gradlew assembleDebug
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: pp-android-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publier la release (APK téléchargeable, via API REST)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # API REST uniquement (gh release create passe par GraphQL, refusé dans les sessions).
          # Idempotent : une release existante pour ce build est remplacée, jamais dupliquée.
          TAG="mobile-v${VERSION_CODE}"
          REPO="${GITHUB_REPOSITORY}"
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk PilotPro.apk
          # Un 404 écrit le corps d'erreur sur la sortie : on ne lit l'id que si la release existe.
          if gh api "repos/${REPO}/releases/tags/${TAG}" >/dev/null 2>&1; then
            EXISTING=$(gh api "repos/${REPO}/releases/tags/${TAG}" --jq .id)
            gh api -X DELETE "repos/${REPO}/releases/${EXISTING}" >/dev/null
            gh api -X DELETE "repos/${REPO}/git/refs/tags/${TAG}" >/dev/null 2>&1 || true
          fi
          NOTES="Installer PilotPro.apk par-dessus l'ancienne version (même signature, aucune désinstallation)."
          RELEASE_ID=$(gh api -X POST "repos/${REPO}/releases" \
            -f tag_name="${TAG}" -f target_commitish="${GITHUB_SHA}" \
            -f name="PilotPro Android ${VERSION_NAME} (build ${VERSION_CODE})" \
            -f body="${NOTES}" -F draft=false -F prerelease=false --jq .id)
          gh api -X POST "https://uploads.github.com/repos/${REPO}/releases/${RELEASE_ID}/assets?name=PilotPro.apk" \
            -H "Content-Type: application/vnd.android.package-archive" --input PilotPro.apk >/dev/null
          gh api -X PATCH "repos/${REPO}/releases/${RELEASE_ID}" -F make_latest=true >/dev/null
  ios:
    runs-on: macos-latest
    env:
      PP_APP_URL: ${{ vars.PP_APP_URL || 'https://crjardin.lovable.app' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: mobile/package-lock.json }
      - run: npm ci --no-audit --no-fund
        working-directory: mobile
      - run: npx cap sync ios
        working-directory: mobile
      - run: xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
        working-directory: mobile/ios/App
