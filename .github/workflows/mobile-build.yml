name: mobile-build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["mobile/**"]
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PP_APP_URL: ${{ vars.PP_APP_URL || 'https://crjardin.lovable.app' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: mobile/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci --no-audit --no-fund
        working-directory: mobile
      - run: npx cap sync android
        working-directory: mobile
      - name: Version depuis public/mobile-version.json
        run: |
          echo "VERSION_CODE=$(jq -r .latestBuild public/mobile-version.json)" >> $GITHUB_ENV
          echo "VERSION_NAME=$(jq -r .versionName public/mobile-version.json)" >> $GITHUB_ENV
      - name: Clé de signature fixe (mises à jour par-dessus l'installation)
        run: |
          mkdir -p ~/.android
          cp mobile/android/pp-debug.keystore ~/.android/debug.keystore
      - run: ./gradlew assembleDebug
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: pp-android-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publier la release (APK téléchargeable)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk PilotPro.apk
          gh release create "mobile-v${VERSION_CODE}" PilotPro.apk --title "PilotPro Android ${VERSION_NAME} (build ${VERSION_CODE})" --notes "Installer PilotPro.apk par-dessus l'ancienne version." --latest
  ios:
    runs-on: macos-latest
    env:
      PP_APP_URL: ${{ vars.PP_APP_URL || 'https://crjardin.lovable.app' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: mobile/package-lock.json }
      - run: npm ci --no-audit --no-fund
        working-directory: mobile
      - run: npx cap sync ios
        working-directory: mobile
      - run: xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
        working-directory: mobile/ios/App
