name: Temporary SiteWebPages Prettier formatter
on:
  push:
    branches:
      - feat/site-web-pages-tab
permissions:
  contents: write
jobs:
  prettier-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/site-web-pages-tab
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Format file and push only if changed
        run: |
          bunx prettier --write src/components/pilot/SiteWebPages.tsx
          if git diff --quiet; then
            echo "Prettier did not change the file."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/pilot/SiteWebPages.tsx
          git commit -m "style(site-web): appliquer Prettier à l’onglet Pages"
          git push origin HEAD:feat/site-web-pages-tab
